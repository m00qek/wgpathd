# Versioned docs (docs/reference/docs-publishing.md): release tags vX.Y.Z and
# docs/X.Y branches publish version X.Y to gh-pages; main and PRs only build.
name: docs

on:
  push:
    branches:
      - main
      - 'docs/[0-9]+.[0-9]+'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    # Not applied to tags.
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'mkdocs.mike.yml'
      - 'devenv/gh-pages/**'
      - 'devenv/scripts/docs-*.sh'
      - 'devenv/services/docs/**'
      - 'test/docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'mkdocs.mike.yml'
      - 'devenv/gh-pages/**'
      - 'devenv/scripts/docs-*.sh'
      - 'devenv/services/docs/**'
      - 'test/docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Republish this release tag (vX.Y.Z) or docs branch (docs/X.Y)
        required: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict build with mkdocs.yml
        run: make -C docs build
      - name: Strict build with mkdocs.mike.yml
        run: make -C docs build-mike
      - name: Test the publishing scripts
        run: make -C docs test

  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/heads/docs/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    env:
      REF: ${{ inputs.ref || github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
          # Tags and history, for the docs-only guard.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r devenv/services/docs/requirements.txt
      - name: Configure git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - name: Strict build
        run: mkdocs build --strict --config-file mkdocs.mike.yml
      - name: Publish
        run: devenv/scripts/docs-publish.sh "$REF"
