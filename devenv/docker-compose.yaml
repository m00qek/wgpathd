name: wgpathd

x-openwrt-build: &openwrt-build
  context: ./services/openwrt
  args:
    OPENWRT_ARCH: ${OPENWRT_ARCH}
    OPENWRT_VERSION: ${OPENWRT_VERSION}
    PKG_DEPENDS: ${PKG_DEPENDS}

services:
  openwrt:
    image: wgpathd-openwrt:${OPENWRT_ARCH}-${OPENWRT_VERSION}
    build: *openwrt-build
    network_mode: none
    init: true
    volumes:
      - ..:/wgpathd:ro

  # e2e topology (design "E2E test harness"); not built yet.
  hub:
    profiles: [e2e]
    image: wgpathd-openwrt:${OPENWRT_ARCH}-${OPENWRT_VERSION}
    cap_add: [NET_ADMIN]
    environment: [WGPATHD_ROLE=hub]
  spoke-a:
    profiles: [e2e]
    image: wgpathd-openwrt:${OPENWRT_ARCH}-${OPENWRT_VERSION}
    cap_add: [NET_ADMIN]
    environment: [WGPATHD_ROLE=spoke, WGPATHD_SITE=a]
  spoke-b:
    profiles: [e2e]
    image: wgpathd-openwrt:${OPENWRT_ARCH}-${OPENWRT_VERSION}
    cap_add: [NET_ADMIN]
    environment: [WGPATHD_ROLE=spoke, WGPATHD_SITE=b]
